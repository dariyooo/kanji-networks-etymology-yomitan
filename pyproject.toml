[project]
name = "kanji-networks-etymology-yomitan"
version = "0.1.0"
description = "Kanji etymologies from Lawrence J. Howell's Kanji Networks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dalang-dict-utils",
    "kanjinetworks",
    "pdfminer.six>=20260107",
    "pypdf>=6.8.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.uv.sources]
dalang-dict-utils = { git = "https://github.com/dariyooo/dalang-dict-utils", tag = "v0.2.8" }
# Vendored parser of the Kanji Networks PDF, ported to Python 3 (see vendored_sources/README.md)
kanjinetworks = { path = "vendored_sources/kanjinetworks" }

[tool.ruff]
line-length = 120
target-version = "py312"
# Vendored third-party code stays as it was copied
extend-exclude = ["vendored_sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["build.py", "kanji_networks_etymology", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
